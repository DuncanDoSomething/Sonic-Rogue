<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Sonic Rogue</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" />
  <style>
    :root { --bg: #0b0d14; --fg: #cfd6ee; --dim: #6b7493; --accent: #f2c230; --font: "Press Start 2P", ui-monospace, monospace; color-scheme: dark; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; color: var(--fg); }
    .shell { height: 100%; display: flex; flex-direction: column; }
    #game { flex: 1; min-height: 0; }
    canvas { image-rendering: pixelated; }
  </style>
</head>
<body>
  <div class="shell">
    <div id="game"></div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
